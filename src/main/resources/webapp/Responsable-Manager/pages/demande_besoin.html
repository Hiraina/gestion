<div class="ui-page">

    <div id="step-1" class="form-step active"><h3 class="ui-step-title">Informations générales</h3><div class="ui-form-grid"><div class="ui-field"><label for="date_demande">Date de la demande</label><input class="ui-input" type="date" id="date_demande" name="date_demande" value="2026-10-17" required></div><div class="ui-field"><label for="manager">Manager demandeur</label><input class="ui-input" type="text" id="manager" name="manager" value="Rakoto Jean"></div><div class="ui-field"><label for="departement">Département</label><select class="ui-select" id="departement" name="departement" required><option value="">Sélectionner</option><option value="informatique" selected>Informatique</option><option value="rh">Ressources humaines</option><option value="finance">Finance</option><option value="commercial">Commercial</option><option value="marketing">Marketing</option><option value="production">Production</option><option value="administration">Administration</option></select></div><div class="ui-field"><label for="service">Service / Section</label><select class="ui-select" id="service" name="service" required><option value="">Sélectionner</option><option value="developpement" selected>Développement</option><option value="infrastructure">Infrastructure</option><option value="support">Support informatique</option><option value="securite">Sécurité informatique</option></select></div></div></div>

  </form>
  </div></section>
</div>
