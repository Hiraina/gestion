<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="context-path" th:content="@{/}" />
    <title>Responsable Manager · Carrière+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" th:href="@{/css/design.css}" />
    <link rel="stylesheet" th:href="@{/css/direction-detail.css}" />

  <body class="app" th:attr="data-dossier=${dossier}">

cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></symbol><symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol><symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></symbol><symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7.5V12l3 2"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.5 3.2 8 7.5 9.5 4.3-1.5 7.5-5 7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></symbol><symbol id="i-money" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/></symbol></svg>

    <aside class="app-sidebar" id="sidebar" aria-label="Navigation principale">
      <a class="app-brand" href="#page=welcome" data-page="welcome" data-label="Accueil">
        <img class="app-brand-mark" th:src="@{/img/logo.png}" alt="" />
        <span class="app-brand-name">Carrière+<small>Gestion du recrutement</small></span>
      </a>

      <nav class="nav">
        <ul>
          <li><a href="#page=welcome" data-page="welcome" data-label="Accueil"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Accueil</span></a></li>
          <li><a href="#page=demande_besoin" data-page="demande_besoin" data-label="Demande de besoin"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Demande de besoin</span></a></li>
          <li><a href="#page=brouillons" data-page="brouillons" data-label="Brouillons"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg><span>Brouillons</span></a></li>
          <li><a href="#page=suivi" data-page="suivi" data-label="Suivi de mes demandes"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span>Suivi de mes demandes</span></a></li>
          <li><a href="#page=historique" data-page="historique" data-label="Historique"><svg class="icon" aria-hidden="true"><use href="#i-history"/></svg><span>Historique</span></a></li>
        </ul>
      </nav>

      <div class="sidebar-user">
        <span class="avatar">MA</span>
        <div class="sidebar-user-text">
          <strong>Responsable Manager</strong>
          <span>Session active</span>
        </div>
        <a class="logout" th:href="@{/index}" title="Se déconnecter" aria-label="Se déconnecter"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg></a>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="app-body">
      <header class="app-topbar">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <div class="topbar-title">
          <small>Responsable Manager</small>
          <strong id="topbar-title">Accueil</strong>
        </div>
        <span class="topbar-spacer"></span>
        <span class="role-chip"><span class="avatar" style="width:28px;height:28px;font-size:11px">MA</span><span class="label">Responsable Manager</span></span>
      </header>

      <main class="app-main" id="main-content"></main>

      <footer class="app-footer">
        <span>&copy; 2026 <strong>Carrière+</strong> · Plateforme de gestion du recrutement</span>
        <span>Antananarivo, Madagascar</span>
      </footer>
    </div>

    <script th:src="@{/js/manager.js}"></script>
    <script th:src="@{/js/direction-detail.js}"></script>
    <script th:src="@{/js/templating.js}"></script>
    <script th:src="@{/js/shell.js}"></script>
  </body>
</html>
