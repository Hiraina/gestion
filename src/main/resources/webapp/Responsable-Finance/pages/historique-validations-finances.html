<div class="ui-page">
  <header class="ui-head">
    <div class="ui-head-text">
      <p class="ui-eyebrow">Budget et validation</p>
      <h1 class="ui-title">Historique des validations</h1>
      <p class="ui-lead">Toutes les demandes examinées par la Finance, avec traçabilité des décisions.</p>
    </div>
  </header>

  <section class="ui-card">
    <div class="ui-card-head"><div><h2 class="ui-card-title">Décisions financières</h2><p class="ui-card-sub" id="hist-count">Examens au total</p></div></div>
    <div class="ui-filters" data-filter-table><div class="ui-search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="hist-finance-search" placeholder="Rechercher une référence ou un poste" aria-label="Rechercher une référence ou un poste"></div><select id="hist-finance-filter-decision" aria-label="Décision"><option value="">Décision</option><option value="Validé">Validé</option><option value="Refusé">Refusé</option><option value="En attente">En attente</option></select></div>
    <div class="ui-table-wrap">
      <table class="ui-table">
        <thead><tr><th>Référence</th><th>Poste</th><th class="num">Budget examiné</th><th>Décision</th><th>Commentaire</th><th>Date</th><th>Responsable</th></tr></thead>
        <tbody id="history-finance-tbody"></tbody>
      </table>
    </div>
    <div class="ui-table-foot"><span id="hist-total">0 examens</span><nav class="ui-pager" aria-label="Pagination"><a href="#" class="is-active">1</a></nav></div>
  </section>
</div>
<script>
(function () {
  function fmtMoney(v) {
    if (v == null) return '—';
    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'MGA', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(v).replace('Ar', '').trim() + ' Ar';
  }
  function decisionBadge(d) {
    var cls = 'is-neutral';
    if (d === 'APPROUVEE' || d === 'Validé') cls = 'is-success';
    if (d === 'REFUSEE' || d === 'Refusé') cls = 'is-danger';
    if (d === 'EN_ATTENTE' || d === 'En attente') cls = 'is-pending';
    var label = d === 'APPROUVEE' ? 'Validé' : d === 'REFUSEE' ? 'Refusé' : d === 'EN_ATTENTE' ? 'En attente' : d;
    return '<span class="ui-badge ' + cls + '">' + label + '</span>';
  }
  function load() {
    fetch(appBaseUrl() + 'api/finance/historique-validations')
      .then(function (r) { return r.json(); })
      .then(function (list) {
        var tbody = document.getElementById('history-finance-tbody');
        tbody.innerHTML = '';
        (list || []).forEach(function (d) {
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td class="ref">DEM-' + String(d.reference || d.id || '—').padStart(3, '0') + '</td>' +
            '<td>' + (d.poste || '—') + '</td>' +
            '<td class="num">' + fmtMoney(d.budget_examine) + '</td>' +
            '<td>' + decisionBadge(d.decision) + '</td>' +
            '<td>' + (d.commentaire || '—') + '</td>' +
            '<td>' + (d.date || '—') + '</td>' +
            '<td>' + (d.responsable || '—') + '</td>';
          tbody.appendChild(tr);
        });
        document.getElementById('hist-total').textContent = (list || []).length + ' examens';
        document.getElementById('hist-count').textContent = (list || []).length + ' examens au total';
      });
  }
  load();
})();
</script>
