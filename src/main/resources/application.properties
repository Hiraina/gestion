# ==============================
# Application
# ==============================
spring.application.name=carriere

# Port d'écoute de l'application Spring Boot
# 8080 est déjà utilisé par le Tomcat standalone (/home/manou/tomcat) sur cette machine
server.port=8081

# Context path de l'application
# URL finale : http://localhost:8081/carriere/index
# Laisser vide si vous voulez déployer à la racine
server.servlet.context-path=/carriere

# Afficher le message d'erreur sur la page web
spring.web.error.include-message=always
# Afficher la ligne de code exacte qui a planté sur la page web
spring.web.error.include-stacktrace=always
# ==============================
# Base de données PostgreSQL
# ==============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:carriere}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==============================
# JPA / Hibernate
# ==============================
# validate = vérifie que les entités correspondent aux tables existantes
# none     = ne touche pas au schéma (recommandé en prod sur schéma existant)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Évite les erreurs de casse sur les noms de tables/colonnes PostgreSQL
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==============================
# Flyway (versioning du schéma)
# ==============================
# Le schéma est créé et mis à jour par les migrations de db/migration/
# (V1__init.sql = schéma complet + données de démonstration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Le schéma "public" a déjà été créé (schéma + données de seed identiques
# à V1__init.sql) mais sans table flyway_schema_history.
# baseline-on-migrate marque ce schéma existant comme Version 1 : V1 est
# ainsi considérée comme déjà appliquée et n'est PAS rejouée
# (sinon erreur "table already exists").
# Ne pas descendre baseline-version sous 1 : les migrations suivantes
# (V2, V3...) s'appliqueront normalement.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.ignore-migration-patterns=versioned:missing
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

# ==============================
# Vues thymeleaf
# ==============================
spring.thymeleaf.prefix=classpath:/webapp/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

logging.level.org.flywaydb=DEBUG
