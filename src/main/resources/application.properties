# ==============================
# Application
# ==============================
spring.application.name=carriere

# Port d'écoute de l'application Spring Boot
# 8080 est déjà utilisé par le Tomcat standalone (/home/manou/tomcat) sur cette machine
server.port=8081

# Context path de l'application
# URL finale : http://localhost:8081/carriere/index
# Laisser vide si vous voulez déployer à la racine
server.servlet.context-path=/carriere

# Afficher le message d'erreur sur la page web
server.error.include-message=always
# Afficher la ligne de code exacte qui a planté sur la page web
server.error.include-stacktrace=always
# ==============================
# Base de données PostgreSQL
# ==============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carriere}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==============================
# JPA / Hibernate
# ==============================
# validate = vérifie que les entités correspondent aux tables existantes
# none     = ne touche pas au schéma (recommandé en prod sur schéma existant)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Évite les erreurs de casse sur les noms de tables/colonnes PostgreSQL
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==============================
# Flyway (versioning du schéma)
# ==============================
# Le schéma est créé et mis à jour par les migrations de db/migration/
# (V1__init.sql = schéma complet + données de démonstration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ==============================
# Vues thymeleaf
# ==============================
spring.thymeleaf.prefix=classpath:/webapp/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true 
